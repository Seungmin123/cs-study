<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Study Dashboard</title>
  <script src="topics.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --surf:    #1e293b;
      --surf2:   #263448;
      --border:  #334155;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --primary: #818cf8;
      --pa:      rgba(129,140,248,.13);
      --green:   #4ade80;
      --ga:      rgba(74,222,128,.13);
      --yellow:  #fbbf24;
      --ya:      rgba(251,191,36,.13);
      --red:     #f87171;
      --ra:      rgba(248,113,113,.13);
      --teal:    #34d399;
      --ta:      rgba(52,211,153,.13);
      --hd-bg:   rgba(15,23,42,.96);
      --shadow:  rgba(0,0,0,.35);
    }

    /* 라이트 테마 오버라이드 */
    :root[data-theme="light"] {
      --bg:      #f8fafc;
      --surf:    #ffffff;
      --surf2:   #f1f5f9;
      --border:  #e2e8f0;
      --text:    #1e293b;
      --muted:   #64748b;
      --primary: #6366f1;
      --pa:      rgba(99,102,241,.10);
      --green:   #16a34a;
      --ga:      rgba(22,163,74,.12);
      --yellow:  #d97706;
      --ya:      rgba(217,119,6,.12);
      --red:     #dc2626;
      --ra:      rgba(220,38,38,.10);
      --teal:    #0d9488;
      --ta:      rgba(13,148,136,.12);
      --hd-bg:   rgba(255,255,255,.92);
      --shadow:  rgba(15,23,42,.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      transition: background-color .2s, color .2s;
      overflow-x: hidden;
    }

    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

    /* ── Header ──────────────────────────────── */
    .hd {
      position: sticky; top: 0; z-index: 50;
      height: 56px; padding: 0 26px;
      background: var(--hd-bg); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 18px;
    }
    .logo { font-size: 16px; font-weight: 800; color: var(--primary); white-space: nowrap; }
    .logo em { color: var(--text); font-style: normal; font-weight: 400; }

    .prog-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
    .prog-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill  { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--primary), var(--teal)); transition: width .6s; width: 0; }
    .prog-label { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Layout ──────────────────────────────── */
    .wrap {
      display: grid; grid-template-columns: 248px 1fr;
      max-width: 1440px; margin: 0 auto;
      padding: 20px 26px; gap: 20px; align-items: start;
    }

    /* ── Sidebar ─────────────────────────────── */
    .sb { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 3px; }
    .sb-title {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      padding: 0 10px; margin-bottom: 5px;
    }
    .ch {
      padding: 9px 11px; border-radius: 8px; cursor: pointer;
      border: 1px solid transparent; transition: all .15s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .ch:hover   { background: var(--surf2); }
    .ch.active  { background: var(--surf2); border-color: var(--primary); }
    .ch-row { display: flex; align-items: center; gap: 7px; }
    .ch-num  { font-size: 10px; color: var(--muted); font-family: monospace; width: 18px; flex-shrink: 0; }
    .ch-name { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.3; }
    .ch-cnt  { font-size: 11px; color: var(--muted); }
    .mini-bar  { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .mini-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width .5s; }

    /* ── Content ─────────────────────────────── */
    .content { min-width: 0; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
    .stat {
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 10px; padding: 13px 15px;
      display: flex; align-items: center; gap: 11px;
    }
    .stat-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .stat.g .stat-icon { background: var(--ga); }
    .stat.y .stat-icon { background: var(--ya); }
    .stat.r .stat-icon { background: var(--ra); }
    .sv { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat.g .sv { color: var(--green); }
    .stat.y .sv { color: var(--yellow); }
    .stat.r .sv { color: var(--red); }
    .sl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Filters */
    .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 13px; }
    .search {
      flex: 1; min-width: 160px;
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 13px;
      color: var(--text); font-size: 13px; outline: none; transition: border-color .15s;
    }
    .search:focus { border-color: var(--primary); }
    .search::placeholder { color: var(--muted); }

    .chip {
      padding: 5px 12px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.on       { background: var(--pa); border-color: var(--primary); color: var(--primary); }
    .chip.on.cg    { background: var(--ga); border-color: var(--green);   color: var(--green); }
    .chip.on.cy    { background: var(--ya); border-color: var(--yellow);   color: var(--yellow); }
    .chip.on.cr    { background: var(--ra); border-color: var(--red);      color: var(--red); }
    .chip.on.ct    { background: var(--ta); border-color: var(--teal);     color: var(--teal); }
    .sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

    .rinfo { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

    /* Pagination */
    .pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin: 22px 0 8px; }
    .pg-btn {
      min-width: 34px; height: 34px; padding: 0 9px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surf); color: var(--text);
      font-size: 13px; cursor: pointer; transition: all .15s; font-variant-numeric: tabular-nums;
    }
    .pg-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .pg-btn.active { background: var(--pa); border-color: var(--primary); color: var(--primary); font-weight: 700; }
    .pg-btn:disabled { opacity: .4; cursor: default; }
    .pg-ell { color: var(--muted); align-self: center; padding: 0 2px; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(288px,100%),1fr)); gap: 10px; min-width: 0; }

    .card {
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; cursor: pointer;
      transition: all .15s; display: flex; flex-direction: column; gap: 8px;
      min-width: 0;
    }
    .card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 22px var(--shadow); }
    .card.done  { border-left: 3px solid var(--teal); }

    .card-top { display: flex; align-items: center; gap: 7px; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .badge.초급 { background: var(--ga); color: var(--green); }
    .badge.중급 { background: var(--ya); color: var(--yellow); }
    .badge.고급 { background: var(--ra); color: var(--red); }
    .cid  { font-size: 10px; color: var(--muted); font-family: monospace; }
    .chk  { color: var(--teal); font-size: 13px; }

    .card-q {
      font-size: 13px; line-height: 1.65; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      min-width: 0; overflow-wrap: anywhere;
    }
    .card-date { font-size: 11px; color: var(--muted); }

    /* Empty */
    .empty { grid-column: 1/-1; text-align: center; padding: 70px 24px; color: var(--muted); }
    .empty-icon { font-size: 42px; margin-bottom: 12px; }
    .empty h3   { color: var(--text); margin-bottom: 6px; }

    /* ── Modal ───────────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); backdrop-filter: blur(5px);
      z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 16px; width: 100%; max-width: 820px; max-height: 90vh; overflow-y: auto;
    }

    .mhead {
      padding: 20px 24px 16px; position: sticky; top: 0;
      background: var(--surf); border-radius: 16px 16px 0 0;
      border-bottom: 1px solid var(--border);
    }
    .mmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; flex-wrap: wrap; }
    .ch-tag { font-size: 11px; color: var(--muted); background: var(--surf2); padding: 2px 8px; border-radius: 4px; }
    .mclose {
      margin-left: 8px; background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; width: 28px; height: 28px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .mclose:hover { background: var(--surf2); color: var(--text); }
    .mq { font-size: 16px; font-weight: 700; line-height: 1.55; }

    .mbody { padding: 20px 24px; }

    .no-ans { text-align: center; padding: 36px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .no-ans small { font-size: 12px; display: block; margin-top: 8px; opacity: .65; }

    .reveal-btn {
      display: block; width: 100%;
      padding: 14px; margin: 4px 0 8px;
      background: var(--pa); border: 1px solid var(--primary);
      color: var(--primary); font-size: 14px; font-weight: 700;
      border-radius: 10px; cursor: pointer; transition: all .15s;
    }
    .reveal-btn:hover { background: var(--primary); color: #0f172a; }
    .reveal-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; opacity: .7; }

    /* ── Markdown ────────────────────────────── */
    .md { font-size: 14px; line-height: 1.8; }

    .md h3 {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      margin: 20px 0 9px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .md h3:first-child { margin-top: 0; }
    .md h2 { font-size: 15px; font-weight: 700; margin: 16px 0 8px; }

    .md p  { margin-bottom: 9px; }
    .md ul { padding-left: 20px; margin-bottom: 9px; }
    .md li { margin-bottom: 4px; }

    .md pre {
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 8px; padding: 15px; overflow-x: auto; margin: 11px 0;
    }
    .md pre code {
      font-family: 'JetBrains Mono','Fira Code',monospace;
      font-size: 13px; line-height: 1.7; color: #c9d1d9; background: none; padding: 0;
    }
    .md :not(pre) > code {
      background: rgba(110,118,129,.18); padding: 1px 6px;
      border-radius: 4px; font-size: 13px; color: var(--primary); font-family: monospace;
    }

    .md table { width: 100%; border-collapse: collapse; margin: 11px 0; font-size: 13px; }
    .md th, .md td { padding: 7px 11px; border: 1px solid var(--border); text-align: left; }
    .md th { background: var(--surf2); font-weight: 600; color: var(--muted); }
    .md tr:nth-child(even) td { background: rgba(255,255,255,.02); }
    .md strong { font-weight: 600; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── 모달 액션 버튼 (완료/확인필요/듣기) ───── */
    .m-acts {
      margin-left: auto; display: flex; align-items: center;
      gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    }
    .done-toggle {
      padding: 4px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .done-toggle:hover { border-color: var(--primary); color: var(--primary); }
    .done-toggle.on { background: var(--ta); border-color: var(--teal); color: var(--teal); }
    .done-toggle.flag-on { background: var(--ya); border-color: var(--yellow); color: var(--yellow); }

    /* ── 카드 표시(확인필요·완료) + 메모 미리보기 ── */
    .card-ind { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .card-memo {
      font-size: 12px; color: var(--yellow); background: var(--ya);
      border-radius: 6px; padding: 6px 8px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; overflow-wrap: anywhere;
    }

    /* ── 메모 입력 (모달) ─────────────────────── */
    .memo-sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .memo-title {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    }
    .memo-status { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 11px; }
    .memo-input {
      width: 100%; min-height: 74px; resize: vertical;
      background: var(--surf2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; color: var(--text); font-size: 13px; line-height: 1.6;
      font-family: inherit; outline: none; transition: border-color .15s;
    }
    .memo-input:focus { border-color: var(--yellow); }
    .memo-input::placeholder { color: var(--muted); }

    /* ── Hamburger + drawer backdrop ─────────── */
    .hamburger {
      display: none;
      background: none; border: 1px solid var(--border); color: var(--text);
      width: 36px; height: 34px; border-radius: 8px; font-size: 17px;
      cursor: pointer; flex-shrink: 0; align-items: center; justify-content: center;
    }
    .hamburger:hover { border-color: var(--primary); color: var(--primary); }

    .theme-toggle {
      flex-shrink: 0; background: none; border: 1px solid var(--border);
      color: var(--text); width: 36px; height: 34px; border-radius: 8px;
      font-size: 15px; cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }

    .sb-mgmt { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
    .mgmt-btn { text-align: left; padding: 7px 11px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .15s; }
    .mgmt-btn:hover { background: var(--surf2); color: var(--text); }
    .mgmt-btn.danger:hover { color: var(--red); border-color: var(--red); }
    .sb-backdrop {
      display: none; position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
    }
    .sb-backdrop.open { display: block; }

    /* ── Mobile (≤768px) ─────────────────────── */
    @media (max-width: 768px) {
      .hd { padding: 0 14px; gap: 10px; }
      .hamburger { display: flex; }
      .logo { font-size: 15px; }
      .logo em { display: none; }          /* 좁은 화면에선 'Dashboard' 축약 */
      .prog-wrap { min-width: 0; }          /* 진도 영역이 줄어들 수 있게 */
      .prog-track { min-width: 28px; height: 5px; }
      .prog-label { font-size: 11px; }

      .wrap { grid-template-columns: 1fr; padding: 14px; gap: 14px; }

      .sb {
        position: fixed; top: 0; left: 0; z-index: 90;
        width: 82%; max-width: 300px; height: 100%;
        background: var(--surf); border-right: 1px solid var(--border);
        padding: 16px 12px; overflow-y: auto;
        transform: translateX(-100%); transition: transform .25s ease;
      }
      .sb.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.4); }

      .stats { gap: 7px; }
      .stat { padding: 10px; flex-direction: column; text-align: center; gap: 6px; }

      .grid { grid-template-columns: minmax(0, 1fr); }

      .filters { gap: 5px 6px; }
      .search { min-width: 100%; order: -1; }
      /* 완료상태 칩과 난이도 칩을 각각 다른 줄로 분리 */
      .sep { flex-basis: 100%; height: 0; width: auto; background: transparent; margin: 2px 0; }

      .overlay { padding: 0; align-items: flex-end; }
      .modal { max-width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; }
      .mhead, .mbody { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<header class="hd">
  <button class="hamburger" id="hamburger" aria-label="챕터 메뉴">☰</button>
  <div class="logo">CS Study <em>Dashboard</em></div>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="pFill"></div></div>
    <span class="prog-label" id="pLabel"></span>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환" title="테마 전환">🌙</button>
</header>

<div class="sb-backdrop" id="sbBackdrop"></div>
<div class="wrap">
  <aside class="sb" id="sb"></aside>
  <main class="content">
    <div class="stats"   id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="rinfo"   id="rinfo"></div>
    <div class="grid"    id="grid"></div>
    <div class="pager"   id="pager"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="주제 상세">
    <div class="mhead" id="mhead"></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
let flat = [];
let selCh  = 'all', selLv = 'all', selSt = 'all', q = '';
let page = 1;
const PAGE_SIZE = 24;

// 완료 체크·메모·확인필요는 정적 데이터에 쓸 수 없으므로 브라우저(기기)별 localStorage에 저장.
// 키는 github.io 공용 오리진 충돌을 피하려고 프로젝트명으로 네임스페이스.
const LS_KEY   = 'cs-study:covered:v1';
const MEMO_KEY = 'cs-study:memos:v1';
const FLAG_KEY = 'cs-study:flags:v1';
function loadLS(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } }
function persist(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
let saved = loadLS(LS_KEY);   // { id: { covered, coveredAt } }
let memos = loadLS(MEMO_KEY); // { id: { text, updatedAt } }
let flags = loadLS(FLAG_KEY); // { id: true }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function setCovered(id, val) {
  const t = flat.find(x => x.id === id);
  if (!t) return;
  t.covered = val;
  t.coveredAt = val ? todayStr() : null;
  if (val) saved[id] = { covered: true, coveredAt: t.coveredAt };
  else delete saved[id];
  persist(LS_KEY, saved);
  render();
}
function setFlagged(id, val) {
  if (val) flags[id] = true;
  else delete flags[id];
  persist(FLAG_KEY, flags);
  render();
}
function setMemo(id, text) {
  text = text.trim();
  // updatedAt은 기기 간 병합 시 최신본 판정에 쓰이므로 분 단위까지 기록
  if (text) memos[id] = { text, updatedAt: new Date().toISOString() };
  else delete memos[id];
  persist(MEMO_KEY, memos);
}
function reapplySaved() {
  for (const t of flat) {
    const s = saved[t.id];
    t.covered   = s ? s.covered   : t._baseCov;
    t.coveredAt = s ? s.coveredAt  : t._baseAt;
  }
}
function exportProgress() {
  const payload = { version: 2, covered: saved, memos: memos, flags: flags };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cs-study-progress.json'; a.click();
  URL.revokeObjectURL(url);
}
function importProgress(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) throw new Error('형식');
      if (obj.version === 2) {
        saved = obj.covered || {}; memos = obj.memos || {}; flags = obj.flags || {};
      } else {
        saved = obj; // v1 백업: 완료 체크만 들어 있음. 기존 메모·확인필요는 유지
      }
      persist(LS_KEY, saved); persist(MEMO_KEY, memos); persist(FLAG_KEY, flags);
      reapplySaved(); render();
      alert(`진도를 가져왔습니다. (완료 ${Object.keys(saved).length} · 메모 ${Object.keys(memos).length} · 확인 필요 ${Object.keys(flags).length})`);
    } catch (err) { alert('가져오기 실패: 올바른 진도 JSON 파일이 아닙니다.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function resetProgress() {
  if (!confirm('이 기기의 완료 체크·메모·확인 필요 표시를 모두 초기화할까요? (되돌릴 수 없습니다)')) return;
  saved = {}; memos = {}; flags = {};
  try {
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(MEMO_KEY);
    localStorage.removeItem(FLAG_KEY);
  } catch (e) {}
  reapplySaved(); render();
}

// ── 기기 간 간편 동기화 (클립보드 / 링크) ───────────────────────
// 진도 전체를 gzip 압축 + base64url로 코드화. 받는 쪽은 덮어쓰지 않고 병합:
// 완료·확인필요는 합집합, 메모는 updatedAt이 더 최근인 쪽 우선.
function b64encode(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64decode(b64) {
  const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
async function encodeSync() {
  const bytes = new TextEncoder().encode(JSON.stringify({ version: 2, covered: saved, memos, flags }));
  if ('CompressionStream' in window) {
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    return 'CSSYNC1:' + b64encode(new Uint8Array(buf));
  }
  return 'CSSYNC0:' + b64encode(bytes);
}
async function decodeSync(str) {
  str = str.trim();
  if (str.startsWith('CSSYNC1:')) {
    const bytes = b64decode(str.slice(8));
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  if (str.startsWith('CSSYNC0:'))
    return JSON.parse(new TextDecoder().decode(b64decode(str.slice(8))));
  return JSON.parse(str); // 진도 JSON 파일 내용을 그대로 붙여넣은 경우
}
function mergeProgress(obj) {
  if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) throw new Error('형식');
  const inc = obj.version === 2 ? obj : { covered: obj, memos: {}, flags: {} };
  let nCov = 0, nMemo = 0, nFlag = 0;
  for (const [id, v] of Object.entries(inc.covered || {}))
    if (!saved[id]) { saved[id] = v; nCov++; }
  for (const [id, m] of Object.entries(inc.memos || {})) {
    const cur = memos[id];
    if (!cur) { memos[id] = m; nMemo++; }
    else if (String(m.updatedAt || '') > String(cur.updatedAt || '')) { memos[id] = m; nMemo++; }
  }
  for (const id of Object.keys(inc.flags || {}))
    if (!flags[id]) { flags[id] = true; nFlag++; }
  persist(LS_KEY, saved); persist(MEMO_KEY, memos); persist(FLAG_KEY, flags);
  reapplySaved(); render();
  return { nCov, nMemo, nFlag };
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); alert(msg); }
  catch (e) { prompt('자동 복사에 실패했습니다. 아래 내용을 직접 복사하세요.', text); }
}
async function applySyncText(text) {
  try {
    text = text.trim();
    const hashIdx = text.indexOf('#sync=');
    if (hashIdx !== -1) text = text.slice(hashIdx + 6); // 링크를 통째로 붙여넣은 경우
    const r = mergeProgress(await decodeSync(text));
    alert(`병합 완료 — 완료 +${r.nCov} · 메모 +${r.nMemo} · 확인 필요 +${r.nFlag}`);
  } catch (e) { alert('동기화 실패: 올바른 동기화 코드가 아닙니다.'); }
}
async function syncCopy() {
  copyText(await encodeSync(),
    '동기화 코드를 복사했습니다.\n다른 기기의 "진도 붙여넣기"로 병합하세요.\n(Mac↔iPhone은 같은 Apple 계정이면 복사 직후 바로 붙여넣기 가능)');
}
async function syncCopyLink() {
  const url = location.href.split('#')[0] + '#sync=' + await encodeSync();
  copyText(url, '동기화 링크를 복사했습니다.\n다른 기기에서 이 링크를 열면 진도가 병합됩니다.');
}
async function syncPaste() {
  let text = '';
  try { text = await navigator.clipboard.readText(); } catch (e) {}
  if (!text || !(text.includes('CSSYNC') || text.trim().startsWith('{')))
    text = prompt('동기화 코드(또는 링크)를 붙여넣으세요.') || '';
  if (text.trim()) applySyncText(text);
}

const EMOJI = {
  data_structures:'🌲', os:'💻', networking:'🌐', database:'🗄️',
  computer_architecture:'⚙️', software_design:'📐',
  system_design:'🏗️', java:'☕', spring:'🍃'
};

// ── Init ───────────────────────────────────────────────────────
(function init() {
  if (typeof TOPICS === 'undefined') {
    document.getElementById('grid').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div>
       <h3>topics.js를 불러올 수 없습니다</h3>
       <p>index.html과 topics.js가 같은 폴더에 있는지 확인하세요.</p></div>`;
    document.getElementById('pLabel').textContent = '로드 실패';
    return;
  }
  for (const [k, ch] of Object.entries(TOPICS.chapters))
    for (const t of ch.topics) {
      const s = saved[t.id];
      flat.push({ chKey: k, chTitle: ch.title, ...t,
        _baseCov: t.covered, _baseAt: t.coveredAt,
        covered:   s ? s.covered   : t.covered,
        coveredAt: s ? s.coveredAt  : t.coveredAt });
    }
  render();
})();

// ── Render ─────────────────────────────────────────────────────
function render() {
  renderHeader(); renderSb(); renderStats(); renderFilters(); renderGrid();
}

function renderHeader() {
  const done = flat.filter(t => t.covered).length, total = flat.length;
  const pct  = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pLabel').textContent = `${done} / ${total} 완료 (${pct}%)`;
}

function renderSb() {
  const el = document.getElementById('sb');
  el.innerHTML = `<div class="sb-title">챕터</div>`;

  const mk = (key, name, num, total, done) => {

      ${num !== '전체' ? `<div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>` : ''}`;
    d.onclick = () => { selCh = key; page = 1; render(); closeSb(); };
    el.appendChild(d);
  };

    // ch.topics는 원본 데이터라 localStorage 완료 체크가 반영되지 않음 — flat 기준으로 집계
    const ts = flat.filter(t => t.chKey === k), done = ts.filter(t => t.covered).length;

  }

  const mgmt = document.createElement('div');

    <button class="mgmt-btn" id="syncPasteBtn">📥 진도 붙여넣기 (병합)</button>
    <button class="mgmt-btn" id="syncLinkBtn">🔗 동기화 링크 복사</button>
    <div class="sb-title" style="margin-top:12px">진도 관리 (이 기기)</div>
    <button class="mgmt-btn" id="expBtn">⬇️ 내보내기</button>
    <button class="mgmt-btn" id="impBtn">⬆️ 가져오기</button>
    <button class="mgmt-btn danger" id="resetBtn">🗑️ 초기화</button>
    <input type="file" id="impFile" accept="application/json" hidden>`;
  el.appendChild(mgmt);
  document.getElementById('syncCopyBtn').onclick = syncCopy;
  document.getElementById('syncPasteBtn').onclick = syncPaste;
  document.getElementById('syncLinkBtn').onclick = syncCopyLink;
  document.getElementById('expBtn').onclick = exportProgress;
  document.getElementById('impBtn').onclick = () => document.getElementById('impFile').click();
  document.getElementById('impFile').onchange = importProgress;
  document.getElementById('resetBtn').onclick = resetProgress;

function renderStats() {
  const sc = selCh === 'all' ? flat : flat.filter(t => t.chKey === selCh);
  const mk = (lv, cls, icon, lbl) => {
    const all = sc.filter(t => t.level === lv), done = all.filter(t => t.covered);
    return `<div class="stat ${cls}">
      <div class="stat-icon">${icon}</div>
      <div><div class="sv">${done.length}<span style="font-size:13px;opacity:.4">/${all.length}</span></div>
      <div class="sl">${lbl} 완료</div></div></div>`;
  };
  document.getElementById('stats').innerHTML =
    mk('초급','g','🟢','초급') + mk('중급','y','🟡','중급') + mk('고급','r','🔴','고급');
}

function renderFilters() {
  const el = document.getElementById('filters');
  const c = (v, cur, extra='') => `class="chip${cur===v?' on '+extra:''}"`;
  el.innerHTML = `
    <input class="search" placeholder="🔍 검색…" value="${esc(q)}" id="sq">
    <button ${c('all', selSt)}        data-st="all">전체</button>
    <button ${c('done',selSt,'ct')}   data-st="done">✅ 완료</button>
    <button ${c('todo',selSt)}        data-st="todo">⬜ 미완료</button>
    <button ${c('flag',selSt,'cy')}   data-st="flag">🔖 확인 필요</button>
    <button ${c('memo',selSt,'cy')}   data-st="memo">📝 메모</button>
    <span class="sep"></span>
    <button ${c('all', selLv)}        data-lv="all">전체 난이도</button>
    <button ${c('초급',selLv,'cg')}   data-lv="초급">초급</button>
    <button ${c('중급',selLv,'cy')}   data-lv="중급">중급</button>
    <button ${c('고급',selLv,'cr')}   data-lv="고급">고급</button>`;

  document.getElementById('sq').oninput = e => { q = e.target.value; page = 1; renderGrid(); };
  el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { selSt = b.dataset.st; page = 1; renderFilters(); renderGrid(); });
  el.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { selLv = b.dataset.lv; page = 1; renderFilters(); renderGrid(); renderStats(); });
}

function filtered() {
  return flat.filter(t => {
    if (selCh !== 'all' && t.chKey !== selCh)   return false;
    if (selLv !== 'all' && t.level !== selLv)   return false;
    if (selSt === 'done' && !t.covered)          return false;
    if (selSt === 'todo' && t.covered)           return false;
    if (selSt === 'flag' && !flags[t.id])        return false;
    if (selSt === 'memo' && !memos[t.id])        return false;
    if (q) {
      const hay = (t.question + ' ' + (t.answer || '') + ' ' + (memos[t.id] ? memos[t.id].text : '')).toLowerCase();
      if (!hay.includes(q.toLowerCase()))        return false;
    }
    return true;
  });
}

function renderGrid() {
  const items = filtered();
  const total = items.length;
  const grid = document.getElementById('grid');
  const pager = document.getElementById('pager');

  if (!total) {
    document.getElementById('rinfo').textContent = `0개 주제`;
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>해당하는 주제가 없습니다</h3><p>조건을 변경해보세요.</p></div>`;
    pager.innerHTML = '';
    return;
  }

  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > pages) page = pages;
  if (page < 1) page = 1;
  const start = (page - 1) * PAGE_SIZE;
  const pageItems = items.slice(start, start + PAGE_SIZE);
  document.getElementById('rinfo').textContent =
    `${total}개 주제 · ${start + 1}–${start + pageItems.length} 표시 (${page}/${pages}페이지)`;

  grid.innerHTML = pageItems.map(t => `
    <div class="card${t.covered?' done':''}" data-id="${t.id}" role="button" tabindex="0" aria-label="${esc(t.question)}">
      <div class="card-top">
        <span class="badge ${t.level}">${t.level}</span>
        <span class="cid">${t.id}</span>
        <span class="card-ind">
          ${flags[t.id] ? '<span title="추가 확인 필요">🔖</span>' : ''}
          ${t.covered ? '<span class="chk">✓</span>' : ''}
        </span>
      </div>
      <div class="card-q">${esc(t.question)}</div>
      ${memos[t.id] ? `<div class="card-memo">📝 ${esc(memos[t.id].text)}</div>` : ''}
      ${t.coveredAt ? `<div class="card-date">📅 ${t.coveredAt}</div>` : ''}
    </div>`).join('');

  grid.querySelectorAll('.card').forEach(c => {
    const open = () => openModal(flat.find(t => t.id === c.dataset.id));
    c.onclick = open;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });

  renderPager(pages);
}

function renderPager(pages) {
  const el = document.getElementById('pager');
  if (pages <= 1) { el.innerHTML = ''; return; }
  const btn = (label, p, o = {}) =>
    `<button class="pg-btn${o.active ? ' active' : ''}"${o.disabled ? ' disabled' : ''} data-p="${p}" aria-label="${o.aria || label + '페이지'}">${label}</button>`;

  const win = [];
  const push = n => { if (n >= 1 && n <= pages && !win.includes(n)) win.push(n); };
  push(1); push(2);
  for (let i = page - 1; i <= page + 1; i++) push(i);
  push(pages - 1); push(pages);
  win.sort((a, b) => a - b);

  let html = btn('‹', page - 1, { disabled: page === 1, aria: '이전 페이지' });
  let prev = 0;
  for (const n of win) {
    if (n - prev > 1) html += `<span class="pg-ell">…</span>`;
    html += btn(n, n, { active: n === page });
    prev = n;
  }
  html += btn('›', page + 1, { disabled: page === pages, aria: '다음 페이지' });
  el.innerHTML = html;

  el.querySelectorAll('.pg-btn[data-p]').forEach(b => b.onclick = () => {
    const p = parseInt(b.dataset.p, 10);
    if (p >= 1 && p <= pages && p !== page) {
      page = p;
      renderGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
}

// ── Modal ──────────────────────────────────────────────────────
function openModal(t) {
  stopTTS();
  let revealed = false;

  document.getElementById('mhead').innerHTML = `
    <div class="mmeta">
      <span class="ch-tag">${EMOJI[t.chKey]||''} ${t.chTitle}</span>
      <span class="badge ${t.level}">${t.level}</span>
      <span style="font-size:10px;color:var(--muted);font-family:monospace">${t.id}</span>
      <span class="m-acts">
        ${'speechSynthesis' in window ? '<button class="done-toggle" id="ttsBtn" title="음성으로 듣기">🔊 듣기</button>' : ''}
        <button class="done-toggle ${flags[t.id]?'flag-on':''}" id="flagBtn">${flags[t.id]?'🔖 확인 필요':'⬜ 확인 필요'}</button>
        <button class="done-toggle ${t.covered?'on':''}" id="doneBtn">${t.covered?'✅ 완료됨':'⬜ 완료 표시'}</button>
        <button class="mclose" id="mcBtn">✕</button>
      </span>
    </div>
    <div class="mq">${esc(t.question)}</div>`;

  const body = document.getElementById('mbody');
  const memo = memos[t.id];
  const memoHtml = `
    <div class="memo-sec">
      <div class="memo-title">📝 내 메모
        <span class="memo-status" id="memoStatus">${memo ? '마지막 저장 ' + memo.updatedAt.slice(0,10) : '자동 저장'}</span>
      </div>
      <textarea class="memo-input" id="memoInput" placeholder="이 문제에 대한 메모를 남겨보세요. 입력하면 자동 저장됩니다.">${esc(memo ? memo.text : '')}</textarea>
    </div>`;

  if (t.answer) {
    body.innerHTML = `
      <div id="ansArea">
        <button class="reveal-btn" id="revealBtn">💡 정답 보기</button>
        <div class="reveal-hint">먼저 스스로 답을 떠올려본 뒤 눌러보세요.</div>
      </div>${memoHtml}`;
    document.getElementById('revealBtn').onclick = () => {
      revealed = true;
      document.getElementById('ansArea').innerHTML = `<div class="md">${parseMd(t.answer)}</div>`;
    };
  } else {
    body.innerHTML = `<div class="no-ans">📝 아직 해설이 작성되지 않은 주제입니다.</div>${memoHtml}`;
  }

  // 메모 자동 저장 (입력 후 0.4초 디바운스)
  const mInput = document.getElementById('memoInput');
  let memoTimer;
  mInput.oninput = () => {
    clearTimeout(memoTimer);
    document.getElementById('memoStatus').textContent = '저장 중…';
    memoTimer = setTimeout(() => {
      setMemo(t.id, mInput.value);
      const st = document.getElementById('memoStatus');
      if (st) st.textContent = memos[t.id] ? '저장됨 · ' + memos[t.id].updatedAt.slice(0,10) : '저장됨 (비어 있음)';
      renderGrid();
    }, 400);
  };

  document.getElementById('overlay').classList.add('open');
  document.getElementById('mcBtn').onclick = closeModal;

  const doneBtn = document.getElementById('doneBtn');
  doneBtn.onclick = () => {
    const nowDone = !t.covered;
    setCovered(t.id, nowDone);
    if (nowDone) { closeModal(); return; }   // 완료 체크 시 상세 닫기
    doneBtn.classList.remove('on');
    doneBtn.textContent = '⬜ 완료 표시';
  };

  const flagBtn = document.getElementById('flagBtn');
  flagBtn.onclick = () => {
    const on = !flags[t.id];
    setFlagged(t.id, on);
    flagBtn.classList.toggle('flag-on', on);
    flagBtn.textContent = on ? '🔖 확인 필요' : '⬜ 확인 필요';
  };

  const ttsBtn = document.getElementById('ttsBtn');
  if (ttsBtn) ttsBtn.onclick = () => {
    if (ttsSpeaking()) { stopTTS(); return; }
    let text = '문제. ' + t.question;
    if (revealed && t.answer) text += ' 해설. ' + ttsStrip(t.answer);
    startTTS(text, ttsBtn);
  };

  if (!lastFocused) lastFocused = document.activeElement;
  document.getElementById('mcBtn').focus();
}
let lastFocused = null;
function closeModal() {
  stopTTS();
  document.getElementById('overlay').classList.remove('open');
  if (lastFocused) { lastFocused.focus(); lastFocused = null; }
}
document.getElementById('overlay').onclick = e => { if (e.target.id === 'overlay') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── TTS (브라우저 내장 Web Speech API — 외부 의존성 없음) ────────
let ttsBtnRef = null;
function ttsSpeaking() { return ttsBtnRef !== null; }
function stopTTS() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (ttsBtnRef) {
    ttsBtnRef.textContent = '🔊 듣기';
    ttsBtnRef.classList.remove('on');
    ttsBtnRef = null;
  }
}
// 마크다운을 읽기 좋은 평문으로: 코드 블록은 건너뛰고 표·서식 기호 제거
function ttsStrip(md) {
  return md
    .replace(/```[\s\S]*?```/g, ' 코드 예시는 화면을 참고하세요. ')
    .replace(/^\|[\s\-|:]+\|$/gm, '')
    .replace(/\|/g, ', ')
    .replace(/^#{1,3}\s*/gm, '')
    .replace(/[`*_>]/g, '')
    .replace(/\n+/g, ' ')
    .replace(/\s{2,}/g, ' ');
}
function startTTS(text, btn) {
  stopTTS();
  ttsBtnRef = btn;
  btn.textContent = '⏹ 중지';
  btn.classList.add('on');
  // 긴 발화가 중간에 끊기는 브라우저 버그 회피: 문장 단위로 나눠 큐잉
  const sentences = text.match(/[^.!?。]+[.!?。]?\s*/g) || [text];
  const queue = [];
  let buf = '';
  for (const s of sentences) {
    if (buf && (buf + s).length > 180) { queue.push(buf); buf = s; }
    else buf += s;
  }
  if (buf.trim()) queue.push(buf);
  queue.forEach((chunk, idx) => {
    const u = new SpeechSynthesisUtterance(chunk);
    u.lang = 'ko-KR';
    u.rate = 1.05;
    if (idx === queue.length - 1) u.onend = stopTTS;
    speechSynthesis.speak(u);
  });
}

// ── 다크/라이트 테마 ────────────────────────────────────────────
const THEME_KEY = 'cs-study:theme';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('themeToggle').textContent = t === 'light' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
(function initTheme() {
  let t;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  applyTheme(t);
})();
document.getElementById('themeToggle').onclick = () =>
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// ── 동기화 링크(#sync=…)로 열린 경우 병합 ───────────────────────
(async function initSyncFromHash() {
  if (!location.hash.startsWith('#sync=')) return;
  const code = decodeURIComponent(location.hash.slice(6));
  history.replaceState(null, '', location.href.split('#')[0]);
  try {
    const obj = await decodeSync(code);
    if (!confirm('동기화 링크로 열었습니다. 링크에 담긴 진도를 이 기기에 병합할까요?')) return;
    const r = mergeProgress(obj);
    alert(`병합 완료 — 완료 +${r.nCov} · 메모 +${r.nMemo} · 확인 필요 +${r.nFlag}`);
  } catch (e) { alert('동기화 링크를 해석할 수 없습니다.'); }
})();

// ── Markdown ───────────────────────────────────────────────────
function parseMd(src) {
  const lines = src.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const ln = lines[i];

    // 코드 블록
    if (/^```/.test(ln.trimStart())) {
      const lang = ln.trim().slice(3).trim();
      let code = ''; i++;
      while (i < lines.length && !/^```/.test(lines[i].trimStart())) { code += esc(lines[i]) + '\n'; i++; }
      html += `<pre><code class="lang-${lang}">${code.trimEnd()}</code></pre>`; i++; continue;
    }

    // 표
    if (ln.includes('|') && i+1 < lines.length && /^\|[\s\-|:]+\|/.test(lines[i+1])) {
      const th = ln.split('|').filter(c=>c.trim()).map(c=>`<th>${inl(c.trim())}</th>`).join('');
      i += 2; let rows = '';
      while (i < lines.length && lines[i].includes('|')) {
        rows += `<tr>${lines[i].split('|').filter(c=>c.trim()).map(c=>`<td>${inl(c.trim())}</td>`).join('')}</tr>`; i++;
      }
      html += `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`; continue;
    }

    // 헤딩
    const h3 = ln.match(/^### (.+)/), h2 = ln.match(/^## (.+)/), h1 = ln.match(/^# (.+)/);
    if (h3) { html += `<h3>${inl(h3[1])}</h3>`; i++; continue; }
    if (h2) { html += `<h2>${inl(h2[1])}</h2>`; i++; continue; }
    if (h1) { html += `<h1>${inl(h1[1])}</h1>`; i++; continue; }

    // 목록
    if (/^[-*] /.test(ln)) {
      let items = '';
      while (i < lines.length && /^[-*] /.test(lines[i])) { items += `<li>${inl(lines[i].slice(2))}</li>`; i++; }
      html += `<ul>${items}</ul>`; continue;
    }

    if (!ln.trim()) { i++; continue; }
    html += `<p>${inl(ln)}</p>`; i++;
  }
  return html;
}

function inl(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
